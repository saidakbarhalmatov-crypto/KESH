name: Build KESH APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack ZIP project
        run: |
          mkdir -p extracted
          unzip -o KESH-Android-Project.zip -d extracted/
          PROJECT_DIR=$(find extracted/ -maxdepth 3 \( -name "build.gradle*" -o -name "settings.gradle*" \) -exec dirname {} \; | head -n 1)
          if [ -n "$PROJECT_DIR" ] && [ "$PROJECT_DIR" != "." ]; then
            echo "Project found in $PROJECT_DIR"
            cp -r "$PROJECT_DIR"/* .
          fi
          rm -rf extracted

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KESH-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          
