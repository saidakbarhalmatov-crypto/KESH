name: Build KESH APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack ZIP project
        run: |
          mkdir -p extracted
          unzip -o KESH-Android-Project.zip -d extracted/
          GRADLEW_PATH=$(find extracted/ -name "gradlew" | head -n 1)
          if [ -n "$GRADLEW_PATH" ]; then
            cd "$(dirname "$GRADLEW_PATH")"
          else
            echo "gradlew not found"
            exit 1
          fi
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KESH-debug-apk
          path: **/outputs/apk/debug/*.apk
          
